# Modeling dataset config — aerobic and anaerobic experiments

# ================ FILES ================
curves_file:
  - "data/processed/aerobic_tidy_curves.csv"
  - "data/processed/anaerobic_tidy_curves.csv"
strain_metadata_file: "data/external/strains_metadata.csv"
output_name: "aero_anaero_modeling_dataset.csv"

# ================ MERGE ================
merge:
  left: "strain_name"
  right: "strain"

# ================ GRANULARITY ================
# per_well = keep replicates (more samples, use group-aware CV)
# averaged = one row per strain-media-condition (replicate mean)
grain: "per_well"

# ================ FEATURIZATION ================
# Each value is an sklearn transformer call string.
# path:<f> = precomputed embedding CSV (first col = key)
features:
  # strain features
  genome_size_bp:
    - log_transform
    - "StandardScaler()"
  gc_content_pct: "StandardScaler()"
  num_contigs: "RobustScaler(with_centering=True, with_scaling=True)"
  n50:
    - log_transform
    - "StandardScaler()"

  # other features
  media_name: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  atmosphere: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  temperature: "StandardScaler()"

# ================ TARGETS ================
targets:
  - growth_class

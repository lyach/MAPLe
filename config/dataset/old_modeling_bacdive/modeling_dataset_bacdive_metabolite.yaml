# Modeling dataset config — BacDive metabolite utilization (strain x substrate)
# Used by run_experiment.py (featurization + targets).

# ================ FILE ================
modeling_dataset_path: "data/external/bacdive_metabolite.parquet"

# ================ FEATURIZATION ================
features:
  # strain features (taxonomy + morphology + physiology)
  genus: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  family: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  phylum: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  gram_stain: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  oxygen_tolerance: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  spore_formation: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  # substrate + assay context
  # substrate_name identity is informative for random/grouped/loso splits; for
  # substrate generalization, add ChEBI-derived chemistry as a path: embedding.
  substrate_name: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  kind_of_utilization: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'

# ================ TARGETS ================
targets:
  - growth_class

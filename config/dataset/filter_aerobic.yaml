# config/dataset/filter_aerobic.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Config for filter_noisy_curves.py
#
# Usage:
#   python scripts/filter_noisy_curves.py config/dataset/filter_aerobic.yaml
#
# ─────────────────────────────────────────────────────────────────────────────

# Input tidy_curves CSV to filter.
input: data/processed/aerobic_tidy_curves.csv

# Where to write the filtered output.
output: data/processed/aerobic_tidy_curves_filtered.csv

# ─────────────────────────────────────────────────────────────────────────────
# Noisy cases to remove.
#
# Each entry must specify all four fields:
#   exp_id  — the experiment identifier (e.g. aerobic_b_37)
#   date    — run date in YYYYMMDD format (e.g. 20260417)
#   strain  — strain name exactly as it appears in the CSV (strain_name column)
#   media   — media name exactly as it appears in the CSV (media_name column)
#
# A row is removed only if it matches ALL four fields exactly.
# ─────────────────────────────────────────────────────────────────────────────

flags:
  - exp_id: "aerobic_b_37"
    date: "20260417"
    strain: "arthrobacter globiformis"
    media: "lb"

  - exp_id: "aerobic_d_37"
    date: "20260512"
    strain: "escherichia coli bl21"
    media: "lb"

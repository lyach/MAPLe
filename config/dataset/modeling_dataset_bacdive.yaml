# Modeling dataset config — BacDive growth (strain x medium)

# ================ FILES ================
curves_file: "data/external/bacdive_growth.parquet"
strain_metadata_file: null
output_name: "bacdive_modeling_dataset.parquet"

# ================ MERGE ================
# No external metadata merge; keys left at defaults for compatibility.
merge:
  left: "strain_name"
  right: "strain"

# ================ GRANULARITY ================
# per_well keeps every (strain, medium) datapoint; group-aware CV (loso/lomo)
# handles the fact that a strain/medium appears in multiple rows.
grain: "per_well"

# ================ FEATURIZATION ================
features:
  # strain features (taxonomy + morphology + physiology)
  genus: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  family: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  phylum: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  gram_stain: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  cell_shape: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  motility: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  oxygen_tolerance: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  spore_formation: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  # media features (parsed from composition — transfer across unseen media)
  n_ingredients: "StandardScaler()"
  has_yeast_extract: "MinMaxScaler()"
  has_peptone: "MinMaxScaler()"
  has_agar: "MinMaxScaler()"
  has_blood_components: "MinMaxScaler()"
  has_nacl: "MinMaxScaler()"
  is_defined: "MinMaxScaler()"

# ================ TARGETS ================
targets:
  - growth_class

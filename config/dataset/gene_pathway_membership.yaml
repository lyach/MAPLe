# config/dataset/gene_pathway_membership.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Config for build_gene_pathway_matrix.py
#
# Usage:
#   python scripts/build_gene_pathway_matrix.py config/dataset/gene_pathway_membership.yaml
#
# Separate from config/dataset/pathway_features.yaml on purpose -- this is an
# ADDITIVE, independent output (per-strain gene x KEGG-module membership),
# not a replacement for or modification of kegg_pathway_completeness.csv.
#
# Run this only after DRAM has been run on DRAC AND you've rsynced back the
# RAW annotation/ output (not just distillate/ -- see docs/pathway_features.md):
#   rsync -avz Nibi:scratch/dram/output/annotation/ data/external/dram/annotation/
# ─────────────────────────────────────────────────────────────────────────────

strains_metadata: data/external/strains_metadata.csv
annotation_dir: data/external/dram/annotation

# Only used to determine WHICH KEGG modules to use as matrix columns -- the
# same 31/32 real-KEGG-module columns that already appear in
# kegg_pathway_completeness.csv, so the two matrices share a module-ID axis.
# See src/pathway_features/kegg_modules.py for why this is a subset, not the
# full completeness matrix's 98 columns.
distillate_dir: data/external/dram/distillate
product_tsv: product.tsv

output_dir: data/external/dram/gene_pathway_membership

# Modeling dataset config — BacDive growth (strain x medium)
# Used by run_experiment.py (featurization + targets).

# ================ FILE ================
modeling_dataset_path: "data/external/bacdive_growth_40k_mediumlabel.parquet"

# ================ FEATURIZATION ================
features:
  # media features (parsed from composition — transfer across unseen media)
  n_ingredients: "StandardScaler()"
  has_yeast_extract: "MinMaxScaler()"
  has_peptone: "MinMaxScaler()"
  has_agar: "MinMaxScaler()"
  has_blood_components: "MinMaxScaler()"
  has_nacl: "MinMaxScaler()"
  complexity: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  temperature:
    - to_numeric
    - 'OrdinalEncoder(handle_unknown="use_encoded_value", unknown_value=-1)'

# ================ TARGETS ================
targets:
  - growth_class

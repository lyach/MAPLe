# BacDive growth classification + XGBoost
name: growth_class_bacdive40k_xgb_sgrouped_genus_no_temp
dataset: config/dataset/bacdive40k_modeling_dataset.yaml
model: config/models/xgboost.yaml
task: growth_class

cv:
  strategy: [stratified_grouped]
  split_on: genus

class_weight: balanced

metrics: [auroc, pr_auc_nogrowth, recall_nogrowth, precision_nogrowth, mcc, balanced_accuracy]

interpret:
  shap: true
  group_importance: true

seed: 42
output_dir: reports

wandb:
  enabled: false

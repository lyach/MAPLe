# Aerobic + XGBoost
name: growth_class_aero_xgb_lomo
dataset: config/dataset/modeling_dataset_aero.yaml
model: config/models/xgboost.yaml
task: growth_class

cv:
  strategy: [lomo]
  n_repeats: 1

metrics: [auroc, pr_auc, f1, mcc, balanced_accuracy]

interpret:
  shap: true
  group_importance: true

seed: 42
output_dir: reports

wandb:
  enabled: false

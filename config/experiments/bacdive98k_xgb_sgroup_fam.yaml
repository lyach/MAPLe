# BacDive growth classification + XGBoost
name: growth_class_bacdive98k_xgb_sgrouped_family
dataset: config/dataset/bacdive98k_modeling_dataset.yaml
model: config/models/xgboost.yaml
task: growth_class

cv:
  strategy: [stratified_grouped]
  splits_file: data/modeling/splits_bacdive_growth_98k/family_bacdive_growth_98k.csv
  split_on: family

class_weight: balanced

metrics: [auroc, pr_auc_nogrowth, recall_nogrowth, precision_nogrowth, mcc, balanced_accuracy]

interpret:
  shap: true
  group_importance: true

seed: 42
output_dir: reports

wandb:
  enabled: false

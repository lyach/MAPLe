# Aerobic+Anaerobic dataset
name: maxod_aero_anaero_rf_random_pathways_pc25
dataset: config/dataset/modeling_dataset_aero_anaero.yaml
model: config/models/random_forest.yaml
task: max_od

cv:
  strategy: [random]
  n_repeats: 1

metrics: [rmse, r2, pearson_r, mae, spearman_r]

interpret:
  shap: true
  group_importance: true

seed: 42
output_dir: reports

wandb:
  enabled: false

# Aerobic+Anaerobic dataset
name: maxod_aero_anaero_mlp_lomo
dataset: config/dataset/modeling_dataset_aero_anaero.yaml
model: config/models/mlp.yaml
task: max_od

cv:
  strategy: [lomo]
  n_repeats: 1

metrics: [rmse, r2, pearson_r, mae, spearman_r]

interpret:
  shap: true
  group_importance: true

seed: 42
output_dir: reports

wandb:
  enabled: false

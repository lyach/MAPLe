# Aerobic+Anaerobic + XGBoost
name: maxod_aero_anaero_xgb
dataset: config/dataset/modeling_dataset_aero_anaero.yaml
model: config/models/xgboost.yaml
task: max_od

cv:
  strategy: [loso, lomo, grouped, random]
  n_repeats: 1

metrics: [rmse, r2, pearson_r, mae]

interpret:
  shap: true
  group_importance: true

seed: 42
output_dir: reports

wandb:
  enabled: false

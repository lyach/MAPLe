# Aerobic+Anaerobic + XGBoost
name: growth_class_aero_anaero_xgb_random
dataset: config/dataset/modeling_dataset_aero_anaero.yaml
model: config/models/xgboost.yaml
task: growth_class

cv:
  strategy: [random]
  n_repeats: 1

metrics: [auroc, pr_auc, f1, mcc, balanced_accuracy]

interpret:
  shap: true
  group_importance: true

seed: 42
output_dir: reports

wandb:
  enabled: false

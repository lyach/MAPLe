# Aerobic+Anaerobic + XGBoost
name: growth_class_aero_anaero_rf_grouped_pathways_pc25
dataset: config/dataset/modeling_dataset_aero_anaero.yaml
model: config/models/random_forest.yaml
task: growth_class

cv:
  strategy: [grouped]
  n_repeats: 1
  group_on: "strain_name"

metrics: [auroc, pr_auc, f1, mcc, balanced_accuracy]

interpret:
  shap: true
  group_importance: true
  shap_class: positive

seed: 42
output_dir: reports

wandb:
  enabled: false

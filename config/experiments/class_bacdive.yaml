# BacDive growth classification + XGBoost
name: growth_class_bacdive_xgb
dataset: config/dataset/modeling_dataset_bacdive.yaml
model: config/models/xgboost.yaml
task: growth_class

cv:
  strategy: [stratified_grouped]
  n_repeats: 1

class_weight: balanced # Upweights the rare class (no-growth, 0) during training

metrics: [auroc, pr_auc_nogrowth, recall_nogrowth, precision_nogrowth, mcc, balanced_accuracy]

interpret:
  shap: true
  group_importance: true

seed: 42
output_dir: reports

wandb:
  enabled: false

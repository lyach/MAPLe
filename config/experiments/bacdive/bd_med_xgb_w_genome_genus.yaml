# BacDive (strain, med) w genome, XGBoost , genus split
name: bd_med_w_genome_xgb_genus
dataset: config/dataset/modeling_bacdive/bd_med_w_genome_genus.yaml
model: config/models/xgboost.yaml
task: growth_class

cv:
  strategy: [stratified_grouped]
  splits_file: data/modeling/splits_bd_med_w_genome/genus_bd_med_w_genome.csv
  split_on: genus

class_weight: balanced

metrics: [auroc, pr_auc_nogrowth, recall_nogrowth, precision_nogrowth, mcc, balanced_accuracy]

interpret:
  shap: true
  group_importance: true

seed: 42
output_dir: reports

wandb:
  enabled: false

# BacDive (strain, med), XGBoost , family split
name: bd_med_xgb_fam
dataset: config/dataset/modeling_bacdive/bd_med_fam.yaml
model: config/models/xgboost.yaml
task: growth_class

cv:
  strategy: [stratified_grouped]
  splits_file: data/modeling/splits_bd_med/family_bd_med.csv
  split_on: family

class_weight: balanced

metrics: [auroc, pr_auc_nogrowth, recall_nogrowth, precision_nogrowth, mcc, balanced_accuracy]

interpret:
  shap: true
  group_importance: true

seed: 42
output_dir: reports

wandb:
  enabled: false

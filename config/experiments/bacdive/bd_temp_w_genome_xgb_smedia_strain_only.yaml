# ================ EXPERIMENT ================
name: bd_temp_w_genome_xgb_smedia_strain_only
model: config/models/xgboost.yaml
task: growth_class

cv:
  strategy: [stratified_grouped]
  splits_file: data/modeling/splits_bd_temp_w_genome/media_canon_bd_temp_w_genome.csv
  split_on: media_canon

class_weight: balanced

metrics: [auroc, pr_auc_nogrowth, recall_nogrowth, precision_nogrowth, mcc, balanced_accuracy]

interpret:
  shap: false
  group_importance: false

seed: 42
output_dir: reports

wandb:
  enabled: false

# ================ DATASET ================
modeling_dataset_path: "data/processed/bacdive/bd_temp_w_genome.parquet"

# ================ FEATURIZATION ================
features:
  genus: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  family: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  phylum: 'OneHotEncoder(sparse_output=False, handle_unknown="ignore")'
  genome_size_bp:
    - to_numeric
    - 'RobustScaler()'
  
  # NO media features
# ================ TARGETS ================
targets:
  - growth_class

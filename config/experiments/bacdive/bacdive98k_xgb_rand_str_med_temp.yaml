# BacDive growth classification + XGBoost
name: bacdive40k_xgb_random_str_med_temp
dataset: config/dataset/modeling_bacdive/bacdive40k_modeling_strain_med_temp.yaml
model: config/models/xgboost.yaml
task: growth_class

cv:
  strategy: [random]
  n_repeats: 1

class_weight: balanced

metrics: [auroc, pr_auc_nogrowth, recall_nogrowth, precision_nogrowth, mcc, balanced_accuracy]

interpret:
  shap: true
  group_importance: true

seed: 42
output_dir: reports

wandb:
  enabled: false

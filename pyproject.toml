# Project Metadata
[project]
name = "microbenet"
version = "0.1.0"
description = "Virtual environment for the Microbe Dataset"
authors = [
    { name = "Lya Chinas"}
]
requires-python = ">=3.10" 

# --- Dependencies ---
dependencies = [
    
    # Deep Learning
    "torch",
    "torchvision",
    "torchaudio",
    "coral-pytorch",

    # Data Science
    "numpy",
    "pandas",
    "scikit-learn",
    "pyarrow",
    "umap-learn>=0.5.11",

    # Data & Utils
    "matplotlib",
    "seaborn",
    "tqdm",
    "loguru",

    # MLOps
    "wandb",

    # Config
    "pydantic",
    "pydantic-settings",
    "pyyaml",

    # Development
    "ruff",
    "jupyterlab",
    "ipykernel",
    "pre-commit",
    "ipywidgets>=8.1.8",
    "biopython>=1.87",
    # kegg-pathways-completeness-tool (give_completeness): runs locally --
    # no database download, no heavy compute, needs only the KO tables
    # already shipped back from the modular pathway-feature pipeline's HPC
    # run. See docs/pathway_features.md.
    "kegg-pathways-completeness==1.4.3",
]

# uv
[tool.uv]
index-url = "https://pypi.org/simple"

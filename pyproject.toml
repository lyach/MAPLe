# Project Metadata
[project]
name = "maple"
version = "0.1.0"
description = "Virtual environment for the MAPLE project"
authors = [
    { name = "Lya Chinas"}
]
requires-python = ">=3.10" 

# --- Dependencies ---
dependencies = [
    # Deep Learning
    "torch",
    "torchvision",
    "torchaudio",

    # Pinned to the CUDA 12.4 wheels
    # "torch==2.4.1",
    # "torchvision==0.19.1",
    # "torchaudio==2.4.1",
    "coral-pytorch",

    # Data Science
    "numpy",
    "pandas",
    "scikit-learn",
    "pyarrow",
    "umap-learn>=0.5.11",
    "xgboost",
    "shap",

    # Data & Utils
    "matplotlib",
    "seaborn",
    "tqdm",
    "loguru",
    # MLOps
    "wandb",

    # Config
    "pydantic",
    "pydantic-settings",
    "pyyaml",

    # Development
    "ruff",
    "jupyterlab",
    "ipykernel",
    "pre-commit",
    "ipywidgets>=8.1.8",

    # Packages
    "biopython>=1.87",
    "kegg-pathways-completeness==1.4.3",
    "mpl-axes-aligner>=1.3",
    "adjusttext>=1.4.0",
    "bacdive",

]

# uv
[tool.uv]
index-url = "https://pypi.org/simple"


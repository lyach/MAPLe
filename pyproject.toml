# Project Metadata
[project]
name = "microbenet"
version = "0.1.0"
description = "Virtual environment for the Microbe Dataset"
authors = [
    { name = "Lya Chinas"}
]
requires-python = ">=3.10" 

# --- Dependencies ---
dependencies = [
    # Deep Learning
    "torch",
    "torchvision",
    "torchaudio",
    "coral-pytorch",
    # Data Science
    "numpy",
    "pandas",
    "scikit-learn",
    "pyarrow",
    "umap-learn>=0.5.11",
    "xgboost",
    "shap",
    # Data & Utils
    "matplotlib",
    "seaborn",
    "tqdm",
    "loguru",
    # MLOps
    "wandb",
    # Config
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    # Development
    "ruff",
    "jupyterlab",
    "ipykernel",
    "pre-commit",
    "ipywidgets>=8.1.8",

    # Packages
    "biopython>=1.87",
    "kegg-pathways-completeness==1.4.3",
    "mpl-axes-aligner>=1.3",
    "adjusttext>=1.4.0",
    "bacdive",

]

# uv
[tool.uv]
index-url = "https://pypi.org/simple"

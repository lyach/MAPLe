# Rebuild a BacDive modeling table from local cache only (no API).

target: medium_growth

strain_features:
  - genus
  - family
  - order
  - phylum
  - gram_stain
  - cell_shape
  - motility
  - oxygen_tolerance
  - nutrition_type
  - spore_formation
  - gc_content
  - genome_accession
  # registry genome_accession came from: insdc | bvbrc | img
  - genome_accession_source
  - genome_link
  - n16s_accession
  # strain identity -- handles for resolving a genome outside BacDive
  - strain_designation
  - is_type_strain
  - dsm_number
  - culture_collection_ids
  - ncbi_taxid
  - ncbi_taxid_level
  - temperature
  - ph

# Medium features
medium_features:
  - n_ingredients
  - has_yeast_extract
  - has_peptone
  - has_agar
  - has_blood_components
  - has_nacl
  - complexity
  - composition_raw
  - refs

temperature_range_expansion: True

output_file: data/external/bacdive_growth.parquet
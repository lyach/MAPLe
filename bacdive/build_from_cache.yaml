# Rebuild a BacDive modeling table from local cache only (no API).

target: medium_growth

strain_features:
  - genus
  - family
  - order
  - phylum
  - gram_stain
  - cell_shape
  - motility
  - oxygen_tolerance
  - nutrition_type
  - spore_formation
  - gc_content
  - genome_accession
  # registry genome_accession came from: insdc | bvbrc | img
  - genome_accession_source
  - genome_link
  - n16s_accession
  # strain identity -- handles for resolving a genome outside BacDive
  - strain_designation
  - is_type_strain
  - dsm_number
  - culture_collection_ids
  - ncbi_taxid
  - ncbi_taxid_level
  - temperature
  - ph

# Medium features
medium_features:
  - n_ingredients
  - has_yeast_extract
  - has_peptone
  - has_agar
  - has_blood_components
  - has_nacl
  - complexity
  - composition_raw
  - refs

temperature_range_expansion: True

# Named for what it actually is, not what a user might type: full-schema
# builds are bacdive_growth_full[_texpand].parquet (see config.py), so this
# restricted-schema, expanded build is bacdive_growth_texpand.parquet.
# Whatever is written here still gets re-stamped with "_texpand" if this
# doesn't already end that way (config.stamp_temperature_expansion) --
# so even a stale value here can't collide with an unexpanded build's name.
output_file: data/external/bacdive_growth_texpand.parquet